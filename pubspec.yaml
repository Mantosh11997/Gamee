name: space_shooter
description: "Nebula Strike - a vertical space shooter built with Flutter and the Flame engine."
publish_to: "none"
version: 1.0.0+1

environment:
  # flame 1.38.2 requires Dart >= 3.11.0 / Flutter >= 3.41.0
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # Pinned to the latest stable releases on pub.dev.
  flame: 1.38.2
  flame_audio: 2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Transparent PNG sprites. The game still runs if any of them are missing -
    # each component falls back to a code-drawn shape.
    - assets/images/
    # Synthesised SFX (WAV) and the music loop (MP3). Regenerate with
    # `python3 tool/build_audio.py`. Missing files just mean silence.
    - assets/audio/
